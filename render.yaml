services:
  # -------------------------------------------------------------
  # 1. Django REST API Backend Web Service (Free Tier)
  # -------------------------------------------------------------
  - type: web
    name: taskflow-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: todo_backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Enter your Neon PostgreSQL connection string

  # -------------------------------------------------------------
  # 2. Vite + React Frontend Static Site (Free Tier)
  # -------------------------------------------------------------
  - type: web
    name: taskflow-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: todo-frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: taskflow-backend
          property: url
          format: "{value}/api"
